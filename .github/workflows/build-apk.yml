name: Build SIKAYO Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Siapkan Struktur & Konfigurasi
        run: |
          if [ ! -f package.json ]; then
            cat << 'EOF' > package.json
          {
            "name": "sikayo-app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF
          fi

          if [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sikayo.app",
            "appName": "SIKAYO",
            "webDir": "www",
            "server": {
              "cleartext": true
            },
            "android": {
              "backgroundColor": "#0066FF"
            }
          }
          EOF
          fi

          mkdir -p www
          if [ ! -f www/index.html ] && [ -f index.html ]; then
            cp index.html www/index.html
          fi

      - name: Install & Build Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIKAYO-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
